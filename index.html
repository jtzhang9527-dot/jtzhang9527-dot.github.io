<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品库存管理系统 (LeanCloud版)</title>
    
    <!-- 修复点：添加 https: 前缀，确保本地打开也能加载 -->
    <script src="https://cdn.jsdelivr.net/npm/leancloud-storage@4.15.0/dist/av-min.js"></script>
    <!-- 如果上面这个加载失败，可以将上面那行删掉，换成下面这行备用源： -->
    <!-- <script src="https://unpkg.com/leancloud-storage@4.15.0/dist/av-min.js"></script> -->
    
    <style>
        :root {
            --primary: #2c3e50;
            --primary-hover: #1a252f;
            --danger: #c0392b;
            --success: #27ae60;
            --bg-color: #f4f4f4;
            --border-color: #dcdcdc;
            --text-main: #000000;
            --text-header: #333333;
            --radius: 4px;
        }

        * { box-sizing: border-box; }

        body {
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Loading 遮罩层 */
        #loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.7);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- 顶部工具栏 --- */
        .toolbar {
            background: white;
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            margin-bottom: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        input[type="text"], input[type="number"] {
            padding: 8px 10px;
            border: 1px solid #999;
            border-radius: var(--radius);
            outline: none;
            font-size: 14px;
            color: #000;
        }
        
        input:focus { border-color: var(--primary); }
        
        .price-range { display: flex; align-items: center; gap: 5px; }
        .price-range input { width: 80px; }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s;
            color: white;
        }

        .btn-primary { background-color: var(--primary); }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-danger { background-color: var(--danger); }
        .btn-success { background-color: var(--success); }
        .btn-outline { 
            background-color: white; 
            border: 1px solid #666; 
            color: #000; 
        }
        .btn-outline:hover { background-color: #eee; }

        /* --- 表格区域 --- */
        .table-wrapper {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            flex: 1;
            overflow: auto;
            position: relative;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        thead {
            position: sticky;
            top: 0;
            background: #e9e9e9;
            z-index: 10;
            border-bottom: 2px solid #ccc;
        }

        th {
            text-align: left;
            padding: 12px 15px;
            font-weight: bold;
            color: var(--text-header);
            font-size: 14px;
            white-space: nowrap;
        }

        td {
            padding: 10px 15px;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
            font-size: 14px;
            color: #000;
        }

        tr:hover { background-color: #f1f1f1; }

        .product-img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border: 1px solid #999;
            cursor: pointer;
        }

        .truncate {
            max-width: 150px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }
        
        .col-remark .truncate { max-width: 250px; }
        .col-name .truncate { max-width: 200px; font-weight: bold; }

        /* --- 模态框 --- */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }

        .modal-content {
            background-color: white;
            margin: 50px auto;
            padding: 25px;
            border-radius: var(--radius);
            width: 90%;
            max-width: 900px;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .modal-header h2 { margin: 0; font-size: 18px; color: #000; }
        
        .close-btn { font-size: 24px; cursor: pointer; color: #666; }
        .close-btn:hover { color: #000; }

        /* 上传组件 */
        .upload-area {
            border: 2px dashed #999;
            padding: 20px;
            text-align: center;
            background: #fafafa;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .upload-area:hover { border-color: var(--primary); background: #f0f0f0; }

        /* 待录入列表 */
        .pending-list { display: flex; flex-direction: column; gap: 10px; }
        .pending-item {
            display: flex;
            gap: 15px;
            background: #fff;
            border: 1px solid #ccc;
            padding: 15px;
            align-items: flex-start;
        }
        .pending-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
            flex: 1;
        }
        .form-field { display: flex; flex-direction: column; }
        .form-field label { font-size: 12px; margin-bottom: 5px; color: #333; font-weight: bold; }
        .required::after { content: "*"; color: red; margin-left: 2px; }

        /* 列设置弹窗 */
        .column-settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            padding: 10px 0;
        }
        .column-option {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            padding: 5px;
        }
        
        .text-bold { font-weight: bold; }

    </style>
    <style id="dynamic-column-styles"></style>
</head>
<body>

    <!-- 全局 Loading -->
    <div id="loading-overlay">
        <div class="spinner"></div>
        <p style="margin-top: 10px; font-weight: bold;" id="loading-text">加载中...</p>
    </div>

    <!-- 顶部工具栏 -->
    <div class="toolbar">
        <div class="filter-group">
            <label style="font-weight:bold;">筛选:</label>
            <input type="text" id="filter-name" placeholder="名称 / 简称" style="width: 140px;">
            <input type="text" id="filter-remark" placeholder="备注内容" style="width: 140px;">
            <div class="price-range">
                <input type="number" id="filter-price-min" placeholder="最低价">
                <span>-</span>
                <input type="number" id="filter-price-max" placeholder="最高价">
            </div>
            <!-- 修改部分：查询和重置按钮 -->
            <button class="btn btn-primary" onclick="renderTable()">查询</button>
            <button class="btn btn-outline" onclick="resetFilters()">重置</button>
            <button class="btn btn-outline" onclick="fetchData()" title="从服务器重新获取最新数据">刷新云端数据</button>
        </div>

        <div class="filter-group">
            <button class="btn btn-outline" onclick="openColumnSettings()">显示设置</button>
            <button class="btn btn-success" onclick="openAddModal()">新增商品</button>
            <button class="btn btn-danger" onclick="deleteBatch()">批量删除</button>
            <span style="font-size: 13px; color: #000; font-weight: bold; margin-left: 10px;">
                共 <span id="total-count">0</span> 条
            </span>
        </div>
    </div>

    <!-- 表格主体 -->
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th width="40"><input type="checkbox" id="check-all" onclick="toggleSelectAll()"></th>
                    <th class="col-img">图片</th>
                    <th class="col-name">名称</th>
                    <th class="col-shortname">简称</th>
                    <th class="col-cost">成本</th>
                    <th class="col-price">在售价格</th>
                    <th class="col-color">颜色</th>
                    <th class="col-date">入库日期</th>
                    <th class="col-remark">备注</th>
                    <th width="140">操作</th>
                </tr>
            </thead>
            <tbody id="product-table-body">
                <!-- JS 渲染 -->
            </tbody>
        </table>
    </div>

    <!-- 新增商品模态框 -->
    <div id="add-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>新增商品 (同步至LeanCloud)</h2>
                <span class="close-btn" onclick="closeModal('add-modal')">&times;</span>
            </div>
            
            <div class="upload-area" id="drop-zone">
                <p style="margin:0; font-size: 16px; font-weight: bold; color: #000;">点击上传 或 拖拽图片</p>
                <p style="margin:5px 0 0 0; font-size: 13px; color: #666;">支持直接 Ctrl+V 粘贴图片</p>
                <input type="file" id="file-input" multiple accept="image/*" style="display: none;">
            </div>

            <div id="pending-list" class="pending-list"></div>

            <div style="margin-top: 20px; text-align: right; border-top: 1px solid #eee; padding-top: 15px;">
                <button class="btn btn-outline" onclick="clearPending()">清空</button>
                <button class="btn btn-primary" onclick="savePendingProducts()">保存全部到云端</button>
            </div>
        </div>
    </div>

    <!-- 编辑模态框 -->
    <div id="edit-modal" class="modal">
        <div class="modal-content" style="max-width: 500px;">
            <div class="modal-header">
                <h2>编辑商品</h2>
                <span class="close-btn" onclick="closeModal('edit-modal')">&times;</span>
            </div>
            <div style="display: flex; gap: 15px; margin-bottom: 20px;">
                <div style="width: 100px; text-align: center;">
                    <img id="edit-img-preview" src="" style="width: 100px; height: 100px; object-fit: cover; border: 1px solid #999;">
                    <button class="btn btn-outline" style="padding: 2px 8px; font-size: 12px; margin-top: 5px;" onclick="document.getElementById('edit-file-input').click()">换图</button>
                    <input type="file" id="edit-file-input" accept="image/*" style="display: none;">
                </div>
                <div style="flex: 1; display: grid; gap: 10px;">
                    <div class="form-field"><label>名称</label><input type="text" id="edit-name"></div>
                    <div class="form-field"><label class="required">成本</label><input type="number" id="edit-cost"></div>
                </div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="form-field"><label>简称</label><input type="text" id="edit-shortname"></div>
                <div class="form-field"><label>在售价格</label><input type="number" id="edit-price"></div>
                <div class="form-field"><label>颜色</label><input type="text" id="edit-color"></div>
                <div class="form-field"><label>备注</label><input type="text" id="edit-remark"></div>
            </div>
            
            <div style="margin-top: 20px; text-align: right;">
                <input type="hidden" id="edit-id">
                <button class="btn btn-primary" onclick="saveEdit()">保存修改</button>
            </div>
        </div>
    </div>

    <!-- 显示设置模态框 -->
    <div id="col-settings-modal" class="modal">
        <div class="modal-content" style="max-width: 400px;">
            <div class="modal-header">
                <h2>显示字段设置</h2>
                <span class="close-btn" onclick="closeModal('col-settings-modal')">&times;</span>
            </div>
            <div id="col-settings-list" class="column-settings-grid"></div>
            <div style="margin-top: 20px; text-align: right;">
                <button class="btn btn-primary" onclick="saveColumnSettings()">应用设置</button>
            </div>
        </div>
    </div>

    <!-- 大图预览 -->
    <div id="image-view-modal" class="modal" onclick="closeModal('image-view-modal')" style="background-color: rgba(0,0,0,0.8);">
        <div style="display: flex; align-items: center; justify-content: center; height: 100%;">
            <img id="big-image" src="" style="max-height: 90vh; max-width: 90vw; box-shadow: 0 0 20px rgba(0,0,0,0.5); border: 2px solid white;">
        </div>
    </div>

    <script>
        // --- 初始化 LeanCloud ---
        const APP_ID = 'frb1VlAOYKYo8AVDnbanq839-gzGzoHsz';
        const APP_KEY = 'gXha3vHy9Ese7zCOpX8hx9rv';
        
        // 检查 SDK 是否加载成功
        if (typeof AV === 'undefined') {
            alert("错误：LeanCloud SDK 加载失败。\n1. 请检查网络连接。\n2. 如果您在本地直接打开文件，请确保代码中 SDK 引用以 'https:' 开头。");
        } else {
            try {
                AV.init({
                    appId: APP_ID,
                    appKey: APP_KEY,
                    serverURL: "https://frb1vlao.lc-cn-n1-shared.com"
                });
                console.log("LeanCloud Initialized");
            } catch (e) {
                console.error("LeanCloud Init Error:", e);
                alert("LeanCloud 初始化失败，请检查控制台");
            }
        }

        // --- 全局变量 ---
        let products = [];
        let pendingProducts = [];
        
        const allColumns = [
            { id: 'img', label: '图片' },
            { id: 'name', label: '名称' },
            { id: 'shortname', label: '简称' },
            { id: 'cost', label: '成本' },
            { id: 'price', label: '在售价格' },
            { id: 'color', label: '颜色' },
            { id: 'date', label: '入库日期' },
            { id: 'remark', label: '备注' }
        ];

        let visibleColumns = JSON.parse(localStorage.getItem('visibleColumns')) || allColumns.map(c => c.id);

        // --- 初始化 ---
        window.onload = function() {
            if (typeof AV !== 'undefined') {
                fetchData(); // 仅当 SDK 存在时拉取数据
            }
            applyColumnStyles(); 
            setupEventListeners();
        };

        // --- Loading 控制 ---
        function showLoading(text = "加载中...") {
            document.getElementById('loading-text').innerText = text;
            document.getElementById('loading-overlay').style.display = 'flex';
        }
        function hideLoading() {
            document.getElementById('loading-overlay').style.display = 'none';
        }

        // --- 核心：从 LeanCloud 获取数据 ---
        async function fetchData() {
            showLoading("正在同步云端数据...");
            try {
                const query = new AV.Query('product');
                query.descending('createdAt'); // 按创建时间倒序
                query.limit(1000); 

                const results = await query.find();
                
                products = results.map(obj => {
                    const photo = obj.get('photo');
                    // 处理日期
                    let dateStr = '-';
                    const rawDate = obj.get('date');
                    if(rawDate) {
                        dateStr = new Date(rawDate).toISOString().split('T')[0];
                    } else {
                        dateStr = obj.createdAt.toISOString().split('T')[0];
                    }

                    return {
                        id: obj.id, 
                        avObject: obj, 
                        image: photo ? photo.url() : '', 
                        name: obj.get('name') || '',
                        shortName: obj.get('shortName') || '',
                        cost: obj.get('cost') || 0,
                        price: obj.get('price') || 0,
                        color: obj.get('color') || '',
                        remarks: obj.get('remarks') || '',
                        date: dateStr
                    };
                });
                renderTable(); // 获取数据后渲染（此时查询框为空，显示全部）
            } catch (error) {
                console.error(error);
                alert("获取数据失败: " + error.message);
            } finally {
                hideLoading();
            }
        }

        // --- 样式控制列显示 ---
        function applyColumnStyles() {
            const styleEl = document.getElementById('dynamic-column-styles');
            let css = '';
            allColumns.forEach(col => {
                if (!visibleColumns.includes(col.id)) {
                    css += `.col-${col.id}, td.col-${col.id} { display: none; }\n`;
                }
            });
            styleEl.innerHTML = css;
        }

        function openColumnSettings() {
            const container = document.getElementById('col-settings-list');
            container.innerHTML = '';
            allColumns.forEach(col => {
                const isChecked = visibleColumns.includes(col.id) ? 'checked' : '';
                const div = document.createElement('div');
                div.innerHTML = `
                    <label class="column-option">
                        <input type="checkbox" value="${col.id}" ${isChecked}>
                        <span>${col.label}</span>
                    </label>
                `;
                container.appendChild(div);
            });
            document.getElementById('col-settings-modal').style.display = 'block';
        }

        function saveColumnSettings() {
            const checkboxes = document.querySelectorAll('#col-settings-list input[type="checkbox"]');
            visibleColumns = Array.from(checkboxes).filter(cb => cb.checked).map(cb => cb.value);
            localStorage.setItem('visibleColumns', JSON.stringify(visibleColumns));
            applyColumnStyles();
            closeModal('col-settings-modal');
        }

        // --- 表格渲染 与 筛选逻辑 ---
        function renderTable() {
            const tbody = document.getElementById('product-table-body');
            tbody.innerHTML = '';

            // 获取输入框的值
            const nameFilter = document.getElementById('filter-name').value.toLowerCase();
            const remarkFilter = document.getElementById('filter-remark').value.toLowerCase();
            const minPrice = parseFloat(document.getElementById('filter-price-min').value);
            const maxPrice = parseFloat(document.getElementById('filter-price-max').value);

            // 过滤逻辑
            const filtered = products.filter(p => {
                const matchName = p.name.toLowerCase().includes(nameFilter) || p.shortName.toLowerCase().includes(nameFilter);
                const matchRemark = p.remarks.toLowerCase().includes(remarkFilter);
                let matchPrice = true;
                const price = parseFloat(p.price);
                
                // 价格范围检查
                if (!isNaN(minPrice)) matchPrice = matchPrice && (price >= minPrice);
                if (!isNaN(maxPrice)) matchPrice = matchPrice && (price <= maxPrice);
                
                return matchName && matchRemark && matchPrice;
            });

            document.getElementById('total-count').innerText = filtered.length;

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" style="text-align:center; padding: 30px; color:#000;">暂无数据 / 无匹配项</td></tr>';
                return;
            }

            filtered.forEach(p => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><input type="checkbox" class="row-checkbox" value="${p.id}"></td>
                    <td class="col-img"><img src="${p.image || ''}" class="product-img" onclick="showBigImage('${p.image}')" loading="lazy"></td>
                    <td class="col-name"><span class="truncate" title="${p.name}">${p.name}</span></td>
                    <td class="col-shortname">${p.shortName || '-'}</td>
                    <td class="col-cost">¥${p.cost}</td>
                    <td class="col-price" style="font-weight:bold;">¥${p.price || '-'}</td>
                    <td class="col-color">${p.color || '-'}</td>
                    <td class="col-date">${p.date}</td>
                    <td class="col-remark"><span class="truncate" title="${p.remarks}">${p.remarks || '-'}</span></td>
                    <td>
                        <button class="btn btn-primary" style="padding:4px 8px; font-size:12px;" onclick="openEditModal('${p.id}')">编辑</button>
                        <button class="btn btn-danger" style="padding:4px 8px; font-size:12px;" onclick="deleteProduct('${p.id}')">删除</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            document.getElementById('check-all').checked = false;
        }

        // --- 新增：重置筛选 ---
        function resetFilters() {
            // 清空输入框
            document.getElementById('filter-name').value = '';
            document.getElementById('filter-remark').value = '';
            document.getElementById('filter-price-min').value = '';
            document.getElementById('filter-price-max').value = '';
            
            // 重新渲染表格（因为值都空了，所以会显示全部）
            renderTable();
        }

        // --- 图片选择与预览逻辑 ---
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');

        dropZone.onclick = () => fileInput.click();
        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.style.borderColor = 'var(--primary)'; };
        dropZone.ondragleave = () => { dropZone.style.borderColor = '#999'; };
        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#999';
            handleFiles(e.dataTransfer.files);
        };
        fileInput.onchange = (e) => { handleFiles(e.target.files); fileInput.value = ''; };

        window.addEventListener('paste', e => {
            if (document.getElementById('add-modal').style.display === 'block') {
                const items = (e.clipboardData || e.originalEvent.clipboardData).items;
                const files = [];
                for (let item of items) {
                    if (item.kind === 'file' && item.type.startsWith('image')) files.push(item.getAsFile());
                }
                if (files.length > 0) handleFiles(files);
            }
        });

        function handleFiles(files) {
            Array.from(files).forEach(file => {
                if (!file.type.startsWith('image/')) return;
                const previewUrl = URL.createObjectURL(file);
                
                pendingProducts.push({
                    tempId: Math.random().toString(36).substr(2),
                    fileObject: file,
                    imagePreview: previewUrl,
                    name: '', shortName: '', cost: '', price: '', color: '', remarks: ''
                });
                renderPendingList();
            });
        }

        function renderPendingList() {
            const container = document.getElementById('pending-list');
            container.innerHTML = '';
            pendingProducts.forEach(item => {
                const div = document.createElement('div');
                div.className = 'pending-item';
                div.innerHTML = `
                    <img src="${item.imagePreview}" style="width:80px; height:80px; object-fit:cover; border:1px solid #ccc;">
                    <div class="pending-inputs">
                        <div class="form-field"><label>名称</label><input type="text" value="${item.name}" oninput="updatePending('${item.tempId}', 'name', this.value)"></div>
                        <div class="form-field"><label>简称</label><input type="text" value="${item.shortName}" oninput="updatePending('${item.tempId}', 'shortName', this.value)"></div>
                        <div class="form-field"><label class="required">成本</label><input type="number" value="${item.cost}" oninput="updatePending('${item.tempId}', 'cost', this.value)"></div>
                        <div class="form-field"><label>售价</label><input type="number" value="${item.price}" oninput="updatePending('${item.tempId}', 'price', this.value)"></div>
                        <div class="form-field"><label>颜色</label><input type="text" value="${item.color}" oninput="updatePending('${item.tempId}', 'color', this.value)"></div>
                        <div class="form-field"><label>备注</label><input type="text" value="${item.remarks}" oninput="updatePending('${item.tempId}', 'remarks', this.value)"></div>
                    </div>
                    <button class="btn btn-danger" onclick="removePending('${item.tempId}')">删除</button>
                `;
                container.appendChild(div);
            });
        }

        function updatePending(id, field, val) {
            const item = pendingProducts.find(p => p.tempId == id);
            if(item) item[field] = val;
        }
        function removePending(id) {
            pendingProducts = pendingProducts.filter(p => p.tempId != id);
            renderPendingList();
        }
        function clearPending() {
            if(confirm("确定清空？")) { pendingProducts = []; renderPendingList(); }
        }

        function openAddModal() {
            document.getElementById('add-modal').style.display = 'block';
            pendingProducts = [];
            renderPendingList();
        }

        // --- 核心：保存到 LeanCloud ---
        async function savePendingProducts() {
            if (typeof AV === 'undefined') return alert("SDK未加载，无法保存");
            if (pendingProducts.length === 0) return alert("没有可以保存的商品");
            const hasEmptyRequired = pendingProducts.some(p => !p.cost);
            if (hasEmptyRequired) return alert("请填写成本");

            showLoading("正在上传图片并保存数据...");

            try {
                const promises = pendingProducts.map(async (p) => {
                    const avFile = new AV.File(p.fileObject.name, p.fileObject);
                    const savedFile = await avFile.save();

                    const Product = AV.Object.extend('product');
                    const product = new Product();
                    
                    product.set('name', p.name);
                    product.set('shortName', p.shortName);
                    product.set('cost', parseFloat(p.cost));
                    product.set('price', parseFloat(p.price) || 0);
                    product.set('color', p.color);
                    product.set('remarks', p.remarks);
                    product.set('date', new Date()); 
                    product.set('photo', savedFile);

                    return product.save();
                });

                await Promise.all(promises);
                
                alert("保存成功！");
                closeModal('add-modal');
                fetchData();

            } catch (error) {
                console.error(error);
                alert("保存失败: " + error.message);
                hideLoading();
            }
        }

        // --- 编辑与删除 ---
        async function deleteProduct(id) {
            if(!confirm("确定删除该商品？这也会删除云端数据。")) return;
            
            showLoading("正在删除...");
            try {
                const todo = AV.Object.createWithoutData('product', id);
                await todo.destroy();
                products = products.filter(p => p.id !== id);
                renderTable();
            } catch (error) {
                alert("删除失败: " + error.message);
            } finally {
                hideLoading();
            }
        }

        async function deleteBatch() {
            const checkedBoxes = document.querySelectorAll('.row-checkbox:checked');
            if(checkedBoxes.length === 0) return alert("请先选择商品");
            
            if(!confirm(`确定删除这 ${checkedBoxes.length} 个商品吗？`)) return;

            showLoading("正在批量删除...");
            try {
                const ids = Array.from(checkedBoxes).map(c => c.value);
                const objectsToDelete = ids.map(id => AV.Object.createWithoutData('product', id));
                await AV.Object.destroyAll(objectsToDelete);
                fetchData(); 
            } catch (error) {
                alert("批量删除失败: " + error.message);
                hideLoading();
            }
        }

        function openEditModal(id) {
            const p = products.find(i => i.id === id);
            if(!p) return;
            
            document.getElementById('edit-id').value = p.id;
            document.getElementById('edit-name').value = p.name;
            document.getElementById('edit-shortname').value = p.shortName;
            document.getElementById('edit-cost').value = p.cost;
            document.getElementById('edit-price').value = p.price;
            document.getElementById('edit-color').value = p.color;
            document.getElementById('edit-remark').value = p.remarks;
            document.getElementById('edit-img-preview').src = p.image;
            document.getElementById('edit-file-input').value = ''; 
            
            document.getElementById('edit-modal').style.display = 'block';
        }

        async function saveEdit() {
            const id = document.getElementById('edit-id').value;
            const name = document.getElementById('edit-name').value;
            const cost = document.getElementById('edit-cost').value;
            
            if(  !cost) return alert("成本必填");

            showLoading("正在更新...");

            try {
                const product = AV.Object.createWithoutData('product', id);
                
                product.set('name', name);
                product.set('shortName', document.getElementById('edit-shortname').value);
                product.set('cost', parseFloat(cost));
                product.set('price', parseFloat(document.getElementById('edit-price').value) || 0);
                product.set('color', document.getElementById('edit-color').value);
                product.set('remarks', document.getElementById('edit-remark').value);

                const fileInput = document.getElementById('edit-file-input');
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const avFile = new AV.File(file.name, file);
                    const savedFile = await avFile.save();
                    product.set('photo', savedFile);
                }

                await product.save();
                
                alert("修改成功");
                closeModal('edit-modal');
                fetchData();

            } catch (error) {
                alert("更新失败: " + error.message);
                hideLoading();
            }
        }

        // --- 通用工具 ---
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        
        function showBigImage(src) {
            if(!src) return;
            document.getElementById('big-image').src = src;
            document.getElementById('image-view-modal').style.display = 'block';
        }

        function toggleSelectAll() {
            const checked = document.getElementById('check-all').checked;
            document.querySelectorAll('.row-checkbox').forEach(c => c.checked = checked);
        }

        function setupEventListeners() {
            window.onclick = e => { if(e.target.classList.contains('modal')) e.target.style.display = 'none'; }
        }
    </script>
</body>
</html>
